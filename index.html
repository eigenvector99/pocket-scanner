<!doctype html>
<!--
  문서 스캐너 현수 Ver1.1 — 카메라로 찍은 문서를 PDF로 만드는 단일 파일 웹앱


  파이프라인
    촬영 → 원본 그대로(iOS 캔버스 한계 16.5M 픽셀까지) → detectQuad() 테두리 검출
         → 확인 편집기 → warp() 원근 보정 → applyMode() 톤 보정
         → JPEG → buildPdf() → savePdf() 저장
    화질 상한은 MAX_SRC_PX / MAX_OUT_PX 두 상수에 모여 있음.

    detectQuad()  검출 정확도. 흰 배경 위 흰 종이가 가장 어려운 케이스
    applyMode()   톤 보정 (원본 / 선명 / 흑백 / 회색)
    buildPdf()    PDF 조립. 흑백은 FlateDecode로 바꾸면 용량이 크게 준다
    drawSample()  카메라 없이 시험할 합성 문서 사진. 빈 화면의 "샘플로 시험해 보기"에서 호출
-->

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EFF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1312" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="description" content="카메라로 찍은 문서를 자동 보정해 PDF로 저장하는 웹앱">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E7C6D'/%3E%3Crect x='9' y='7' width='14' height='18' rx='1.5' fill='%23fff'/%3E%3Cg fill='%230E7C6D'%3E%3Crect x='12' y='11' width='8' height='1.6'/%3E%3Crect x='12' y='15' width='8' height='1.6'/%3E%3Crect x='12' y='19' width='5' height='1.6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* Claude 아티팩트가 자동으로 넣어주던 기본값 — 단독 파일이라 직접 넣는다 */
  html{color-scheme:light dark}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>문서 스캐너 현수 Ver1.0</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<style>
:root{
  --ground:#EFF3F1;
  --surface:#FFFFFF;
  --surface-2:#E4EAE7;
  --ink:#111C1A;
  --ink-2:#4B5C58;
  --ink-3:#7D8E89;
  --line:#D3DCD9;
  --line-2:#BFCBC7;
  --accent:#0E7C6D;
  --accent-hover:#0B6659;
  --accent-ink:#FFFFFF;
  --accent-soft:#DBEDE8;
  --warn:#A9501C;
  --scrim:rgba(10,18,17,.78);
  --shadow-1:0 1px 1px rgba(17,28,26,.05),0 6px 18px -12px rgba(17,28,26,.32);
  --shadow-2:0 2px 4px rgba(17,28,26,.07),0 18px 40px -20px rgba(17,28,26,.45);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1312;
    --surface:#151F1D;
    --surface-2:#1E2A27;
    --ink:#E7EFEC;
    --ink-2:#A3B4B0;
    --ink-3:#74857F;
    --line:#26332F;
    --line-2:#33433E;
    --accent:#2FBFA4;
    --accent-hover:#4AD3B9;
    --accent-ink:#04211C;
    --accent-soft:#11322C;
    --warn:#D98246;
    --scrim:rgba(4,10,9,.86);
    --shadow-1:0 1px 1px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
    --shadow-2:0 2px 4px rgba(0,0,0,.45),0 18px 40px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1312;
  --surface:#151F1D;
  --surface-2:#1E2A27;
  --ink:#E7EFEC;
  --ink-2:#A3B4B0;
  --ink-3:#74857F;
  --line:#26332F;
  --line-2:#33433E;
  --accent:#2FBFA4;
  --accent-hover:#4AD3B9;
  --accent-ink:#04211C;
  --accent-soft:#11322C;
  --warn:#D98246;
  --scrim:rgba(4,10,9,.86);
  --shadow-1:0 1px 1px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
  --shadow-2:0 2px 4px rgba(0,0,0,.45),0 18px 40px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.shell{max-width:520px;margin:0 auto;padding:0 16px 156px;display:flex;flex-direction:column;gap:20px}

/* header */
.top{
  position:sticky;top:0;z-index:20;
  margin:0 -16px;padding:14px 16px 12px;
  background:var(--ground);
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(150%) blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;
}
.brand{font-weight:600;font-size:17px;letter-spacing:-.02em;margin:0}
.brand .ver{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;font-weight:400;
  color:var(--accent);letter-spacing:.02em;margin-left:3px;
}
.count{margin-left:auto;font-size:12px;color:var(--ink-2);letter-spacing:.04em}
.count b{color:var(--ink);font-weight:500}

/* capture */
.capture{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.btn{
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:var(--r);padding:14px 12px;font-weight:500;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,border-color .15s,transform .08s;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

/* settings */
.settings{display:flex;flex-direction:column;gap:12px}
.field{display:flex;align-items:center;gap:12px}
.label{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;width:62px;flex:none;
}
.seg{display:flex;flex:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{
  flex:1;border:0;background:transparent;padding:8px 4px;font-size:13px;
  color:var(--ink-2);border-right:1px solid var(--line);transition:background .15s,color .15s;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}

/* tray */
.tray-head{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tray-head h2{margin:0;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.hint{font-size:12px;color:var(--ink-3);margin-left:auto}
.tray{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;list-style:none;margin:0;padding:0}
.page{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-1);
}
.page.sample{border-style:dashed;border-color:var(--line-2);box-shadow:none}
.thumbwrap{
  position:relative;background:var(--surface-2);aspect-ratio:3/4;
  display:flex;align-items:center;justify-content:center;padding:8px;
  border:0;width:100%;
}
.thumbwrap img{max-width:100%;max-height:100%;display:block;box-shadow:0 1px 6px rgba(0,0,0,.22)}
.num{
  position:absolute;top:6px;left:6px;background:var(--ink);color:var(--ground);
  font-size:10px;padding:2px 6px;border-radius:4px;letter-spacing:.06em;
}
.tag{
  position:absolute;top:6px;right:6px;background:var(--accent-soft);color:var(--accent);
  font-size:10px;padding:2px 6px;border-radius:4px;letter-spacing:.06em;font-weight:500;
}
.dims{
  position:absolute;bottom:6px;right:6px;font-size:9.5px;color:var(--ink-3);
  background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 5px;border-radius:3px;
}
.acts{display:flex;border-top:1px solid var(--line)}
.acts button{
  flex:1;border:0;background:transparent;padding:8px 2px;font-size:11.5px;color:var(--ink-2);
  border-right:1px solid var(--line);transition:background .15s,color .15s;
}
.acts button:last-child{border-right:0}
.acts button:hover:not([disabled]){background:var(--surface-2);color:var(--ink)}
.acts button.del:hover{color:var(--warn)}
.acts button[disabled]{opacity:.3;cursor:not-allowed}

.add{
  border:1px dashed var(--line-2);border-radius:var(--r);background:transparent;
  aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--ink-3);font-size:13px;width:100%;
  transition:border-color .15s,color .15s,background .15s;
}
.add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.add svg{width:22px;height:22px}
/* 아직 아무것도 없을 때는 촬영 타일이 한 줄을 다 쓴다 */
.tray:has(> li:only-child) li{grid-column:1/-1}
.tray:has(> li:only-child) .add{aspect-ratio:auto;min-height:132px}
.linkbtn{
  border:0;background:none;padding:0;color:var(--accent);font-size:12px;
  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;
}
.dims{pointer-events:none}

/* export bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--ground);
  background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:saturate(150%) blur(12px);
  border-top:1px solid var(--line);
}
.bar-in{max-width:520px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.namerow{display:flex;align-items:center;gap:8px}
.namerow input{
  flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
}
.namerow .ext{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.status{font-size:12px;color:var(--ink-2);min-height:16px}
.status.err{color:var(--warn)}

/* editor */
.editor{
  position:fixed;inset:0;z-index:60;background:var(--scrim);
  display:none;flex-direction:column;
}
.editor.open{display:flex}
.ed-top,.ed-bot{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:var(--surface);border-bottom:1px solid var(--line);flex:none;
}
.ed-bot{border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.ed-top .ttl{font-size:13px;color:var(--ink-2);margin:0 auto}
.ed-btn{
  border:1px solid var(--line-2);background:var(--surface);border-radius:8px;
  padding:7px 12px;font-size:13px;transition:background .15s;
}
.ed-btn:hover{background:var(--surface-2)}
.ed-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ed-btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px}
.canvas-hold{position:relative;line-height:0;touch-action:none}
.canvas-hold canvas{max-width:100%;display:block;border-radius:2px}
.canvas-hold svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.quad-fill{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.handle{fill:var(--accent);stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke}
.handle-hit{fill:transparent}

/* busy */
.busy{
  position:fixed;inset:0;z-index:80;background:var(--scrim);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  color:var(--ink);
}
.busy.open{display:flex}
.spinner{
  width:34px;height:34px;border:2.5px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.busy p{margin:0;font-size:13px;color:var(--ink-2);letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){
  .spinner{animation-duration:2.4s}
  .btn,.seg button,.acts button{transition:none}
}

.foot{font-size:11.5px;color:var(--ink-3);line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
.foot b{font-weight:500;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1 class="brand">문서 스캐너 현수<span class="ver">Ver1.0</span></h1>
    <span class="count mono">담긴 문서 <b id="cnt">0</b>장</span>
  </header>

  <div class="capture">
    <button class="btn primary" id="btnShoot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.2l1.3-2h7.9l1.3 2h2.3A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
      문서 촬영
    </button>
    <button class="btn" id="btnPick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="1.6"/><path d="m3 15.5 4.6-4.2 4 3.6 3.4-3 5 4.4"/><circle cx="8.4" cy="9" r="1.4"/></svg>
      앨범에서
    </button>
  </div>
  <input type="file" id="fileShoot" accept="image/*" capture="environment" class="sr" tabindex="-1">
  <input type="file" id="filePick" accept="image/*" multiple class="sr" tabindex="-1">

  <div class="settings">
    <div class="field">
      <span class="label" id="lbMode">색 처리</span>
      <div class="seg" role="group" aria-labelledby="lbMode" id="segMode">
        <button data-mode="color" aria-pressed="true">원본</button>
        <button data-mode="clean" aria-pressed="false">선명</button>
        <button data-mode="bw" aria-pressed="false">흑백</button>
        <button data-mode="gray" aria-pressed="false">회색</button>
      </div>
    </div>
    <div class="field">
      <span class="label" id="lbPaper">용지</span>
      <div class="seg" role="group" aria-labelledby="lbPaper" id="segPaper">
        <button data-paper="a4" aria-pressed="true">A4</button>
        <button data-paper="letter" aria-pressed="false">Letter</button>
        <button data-paper="fit" aria-pressed="false">원본 비율</button>
      </div>
    </div>
  </div>

  <div>
    <div class="tray-head">
      <h2>페이지</h2>
      <span class="hint" id="trayHint">촬영한 문서가 여기에 쌓입니다</span>
    </div>
    <ul class="tray" id="tray"></ul>
  </div>

  <p class="foot">
    사진은 <b>기기 안에서만</b> 처리되며 어디에도 전송되지 않습니다.<br>
    아이폰 사파리에서 열고 공유 &rarr; <b>홈 화면에 추가</b>를 누르면 앱처럼 실행됩니다.<br>
    카메라를 쓰려면 <b>https</b>로 접속해야 합니다 (로컬 테스트는 localhost도 가능).
  </p>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="namerow">
      <input id="fname" value="스캔문서" aria-label="파일 이름" autocomplete="off" spellcheck="false">
      <span class="ext mono">.pdf</span>
      <button class="btn primary" id="btnSave" style="padding:8px 16px">PDF 저장</button>
    </div>
    <p class="status" id="status"></p>
  </div>
</div>

<div class="editor" id="editor" role="dialog" aria-modal="true" aria-label="테두리 보정">
  <div class="ed-top">
    <button class="ed-btn ghost" id="edCancel">취소</button>
    <p class="ttl" id="edTitle">네 모서리를 문서 꼭짓점에 맞추세요</p>
    <button class="ed-btn primary" id="edApply">적용</button>
  </div>
  <div class="stage">
    <div class="canvas-hold" id="hold">
      <canvas id="edCanvas"></canvas>
      <svg id="edSvg" aria-hidden="true"></svg>
    </div>
  </div>
  <div class="ed-bot">
    <button class="ed-btn" id="edAuto">자동 검출</button>
    <button class="ed-btn" id="edAll">전체 영역</button>
    <button class="ed-btn" id="edRot">회전 90°</button>
  </div>
</div>

<div class="busy" id="busy">
  <div class="spinner"></div>
  <p id="busyText">처리 중…</p>
</div>

<script>
"use strict";
/* ---------------------------------------------------------------- state */
const state = { pages: [], mode: "color", paper: "a4" };

/* 화질 상한 — 원본을 그대로 쓰는 것이 목표. 여기 있는 숫자는 화질을 아끼려는
   값이 아니라, 브라우저가 조용히 실패하는 지점을 피하려는 안전선이다.

   iOS 사파리(와 데스크톱 사파리)는 캔버스 총 면적이 16,777,216 픽셀을 넘으면
   예외를 던지지 않고 그냥 빈 캔버스를 돌려준다. 그래서 그 바로 아래에 선을 둔다.
     12MP (4032×3024 = 12.2M)  → 손대지 않고 통과. 진짜 원본
     24MP (5712×4284 = 24.5M)  → 4700×3525 정도로 줄어듦 (A4 약 300dpi)
     48MP (8064×6048 = 48.8M)  → 같은 크기로 줄어듦
   아이폰 카메라를 12MP로 두면 축소가 아예 일어나지 않는다.

   page.quad는 MAX_SRC_PX로 만든 캔버스의 좌표계에 저장된다.
   renderPage와 openEditor가 같은 상수를 써야 좌표가 어긋나지 않는다. */
const MAX_SRC_PX = 16.5e6;
const MAX_OUT_PX = 16.5e6;
let downloads = null, pdfSupport = "pending", uid = 0;

const $ = (s) => document.querySelector(s);
const els = {
  tray: $("#tray"), hint: $("#trayHint"), cnt: $("#cnt"), status: $("#status"),
  busy: $("#busy"), busyText: $("#busyText"), editor: $("#editor"),
  edCanvas: $("#edCanvas"), edSvg: $("#edSvg"), hold: $("#hold"), fname: $("#fname"),
  edTitle: $("#edTitle"), edCancel: $("#edCancel"),
};

function busy(on, text) {
  if (text) els.busyText.textContent = text;
  els.busy.classList.toggle("open", !!on);
}
function say(msg, isErr) {
  els.status.textContent = msg || "";
  els.status.classList.toggle("err", !!isErr);
}
const nextFrame = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));

/* ------------------------------------------------------- image plumbing */
function loadImage(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { res({ img, url }); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없습니다")); };
    img.src = url;
  });
}
// 총 픽셀 수를 기준으로 줄인다. 긴 변 기준으로 자르면 가로세로 비율에 따라
// 실제 픽셀 수가 4배까지 벌어져서 iOS 캔버스 한계를 예측할 수 없다.
function toCanvas(img, maxPx) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const s = Math.min(1, Math.sqrt(maxPx / (w0 * h0)));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w0 * s));
  c.height = Math.max(1, Math.round(h0 * s));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const canvasToBlob = (c, type, q) => new Promise((r) => c.toBlob(r, type, q));

    for (let x = 0; x < w; x++) {

    const wF = total - wB; if (!wF) break;

      if (px < w - 1 && bin[p + 1] && lab[p + 1] === -1) { lab[p + 1] = id; stack[sp++] = p + 1; }
      if (py > 0 && bin[p - w] && lab[p - w] === -1) { lab[p - w] = id; stack[sp++] = p - w; }
      if (py < h - 1 && bin[p + w] && lab[p + w] === -1) { lab[p + w] = id; stack[sp++] = p + w; }

/* --------------------------------------------------- perspective warp */
function solve(A, b, n) {
  const M = A.map((row, i) => row.concat([b[i]]));
  for (let col = 0; col < n; col++) {
    let piv = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    const tmp = M[col]; M[col] = M[piv]; M[piv] = tmp;
    const pv = M[col][col];
    if (Math.abs(pv) < 1e-12) return null;
    for (let c2 = col; c2 <= n; c2++) M[col][c2] /= pv;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const f = M[r][col];
      if (!f) continue;
      for (let c2 = col; c2 <= n; c2++) M[r][c2] -= f * M[col][c2];

}

    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);

    [{ x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H }, { x: 0, y: H }], quad

  for (let y = 0; y < H; y++) {

  out.height = r === 180 ? c.height : c.width;

  x.translate(out.width / 2, out.height / 2);
  x.rotate(r * Math.PI / 180);
  x.drawImage(c, -c.width / 2, -c.height / 2);
  freeCanvas(c);
  return out;
}

/* ------------------------------------------------------- tone rendering */
function grayOf(D, n) {
  const g = new Uint8ClampedArray(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) g[i] = (D[p] * 77 + D[p + 1] * 150 + D[p + 2] * 29) >> 8;
  return g;
}
/* 평균장(mean field) — 국소 평균 밝기를 담은 저해상도 격자.
   '선명'의 배경 밝기 추정과 '흑백'의 국소 문턱값은 둘 다 저주파라서, 축소한
   격자에서 구한 뒤 쌍선형으로 확대 샘플해도 결과가 눈에 띄게 달라지지 않는다.
   원본 해상도로 적분영상을 만들면 16MP에서 Float64 배열이 132MB가 되어
   아이폰 사파리가 탭을 죽인다. 축소 배율의 제곱만큼 그 비용이 줄어든다.
     shortTarget  축소 후 짧은 변의 목표 길이
     radiusDiv    축소 격자에서 쓸 블러 반경 = min(sw,sh) / radiusDiv */

  const f = Math.max(1, Math.floor(Math.min(w, h) / shortTarget));
  const sw = Math.max(1, Math.floor(w / f)), sh = Math.max(1, Math.floor(h / f));
  let small;
  if (f === 1) small = gray;
  else {
    small = new Uint8ClampedArray(sw * sh);
    for (let y = 0; y < sh; y++) {
      const y0 = y * f, y1 = Math.min(h, y0 + f);
      for (let x = 0; x < sw; x++) {
        const x0 = x * f, x1 = Math.min(w, x0 + f);
        let s = 0, n = 0;
        for (let yy = y0; yy < y1; yy++) {
          const row = yy * w;
          for (let xx = x0; xx < x1; xx++) { s += gray[row + xx]; n++; }
        }
        small[y * sw + x] = s / n;
      }
    }
  }
  const r = Math.max(2, Math.round(Math.min(sw, sh) / radiusDiv));
  return { field: boxBlur(small, sw, sh, r), sw, sh, f };
}
function sampleField(m, x, y) {
  const u = Math.min(m.sw - 1, x / m.f), v = Math.min(m.sh - 1, y / m.f);
  const x0 = u | 0, y0 = v | 0;
  const x1 = x0 + 1 < m.sw ? x0 + 1 : x0, y1 = y0 + 1 < m.sh ? y0 + 1 : y0;
  const fx = u - x0, fy = v - y0, F = m.field;
  const a = F[y0 * m.sw + x0], b = F[y0 * m.sw + x1];
  const c = F[y1 * m.sw + x0], d = F[y1 * m.sw + x1];
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}

function applyMode(imgData, mode) {
  const D = imgData.data, w = imgData.width, h = imgData.height, n = w * h;
  if (mode === "color") return;
  const g = grayOf(D, n);

  if (mode === "bw") {
    const m = meanField(g, w, h, 900, 24);
    for (let y = 0, i = 0, p = 0; y < h; y++) {
      for (let x = 0; x < w; x++, i++, p += 4) {
        const val = g[i] < sampleField(m, x, y) * 0.87 ? 0 : 255;
        D[p] = D[p + 1] = D[p + 2] = val;
      }
    }
    return;
  }

  if (mode === "gray") {
    let lo = 255, hi = 0;
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) hist[g[i]]++;
    let acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > n * 0.02) { lo = v; break; } }
    acc = 0;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > n * 0.02) { hi = v; break; } }
    const span = Math.max(24, hi - lo);
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      const v = Math.max(0, Math.min(255, ((g[i] - lo) * 255) / span));
      D[p] = D[p + 1] = D[p + 2] = v;
    }
    return;
  }

  // "clean": 넓은 반경의 배경 밝기 추정값으로 나눠 그림자·조명 얼룩을 지운 뒤
  // 레벨을 늘려 종이가 흰색에 가깝게 오도록 한다.
  const m = meanField(g, w, h, 300, 10);
  for (let y = 0, p = 0; y < h; y++) {
    for (let x = 0; x < w; x++, p += 4) {
      const b = Math.max(40, sampleField(m, x, y));
      for (let ch = 0; ch < 3; ch++) {
        let v = (D[p + ch] * 236) / b;
        v = ((v - 16) * 255) / 214;
        D[p + ch] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
    }
  }
}

/* ------------------------------------------------------------- pipeline */
async function renderPage(page) {
  const { img, url } = await loadImage(page.srcBlob);
  const src = toCanvas(img, MAX_SRC_PX);
  URL.revokeObjectURL(url);
  if (!page.quad) page.quad = detectQuad(src);
  const q = page.quad;
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  let W = Math.round(Math.max(d(q[0], q[1]), d(q[3], q[2])));
  let H = Math.round(Math.max(d(q[0], q[3]), d(q[1], q[2])));
  const s = Math.min(1, Math.sqrt(MAX_OUT_PX / Math.max(1, W * H)));
  W = Math.max(80, Math.round(W * s)); H = Math.max(80, Math.round(H * s));
  let out = warp(src, q, W, H);
  freeCanvas(src);
  out = rotateCanvas(out, page.rot || 0);
  const ctx = out.getContext("2d", { willReadFrequently: true });
  const id = ctx.getImageData(0, 0, out.width, out.height);
  applyMode(id, state.mode);
  ctx.putImageData(id, 0, 0);
  page.outW = out.width; page.outH = out.height;
  page.outBlob = await canvasToBlob(out, "image/jpeg", state.mode === "bw" ? 0.95 : 0.92);
  const tw = 260, th = Math.round(tw * out.height / out.width);
  const t = document.createElement("canvas"); t.width = tw; t.height = th;
  t.getContext("2d").drawImage(out, 0, 0, tw, th);
  page.thumb = t.toDataURL("image/jpeg", 0.8);
  freeCanvas(t); freeCanvas(out);
}

async function addFiles(files, isSample) {
  const list = Array.from(files).filter((f) => f.type.startsWith("image/"));
  if (!list.length) return;
  const added = [];
  for (let i = 0; i < list.length; i++) {
    busy(true, list.length > 1 ? `문서 인식 중… ${i + 1}/${list.length}` : "문서 인식 중…");
    await nextFrame();
    const page = { id: ++uid, srcBlob: list[i], quad: null, rot: 0, sample: !!isSample };
    try {
      await renderPage(page);
      state.pages.push(page);
      added.push(page);
      draw();
    } catch (e) {
      say("사진 한 장을 처리하지 못했습니다: " + e.message, true);
    }
  }
  busy(false);
  if (!added.length) return;

  // 새로 담은 페이지는 검출 결과를 한 장씩 확인받는다.
  for (let i = 0; i < added.length; i++) {
    if (!state.pages.includes(added[i])) continue;
    await openEditor(added[i], { index: i + 1, total: added.length });
  }
  say(added.length > 1 ? `${added.length}장을 담았습니다.` : "1장을 담았습니다.");
}

async function reprocessAll(note) {
  if (!state.pages.length) return;
  for (let i = 0; i < state.pages.length; i++) {
    busy(true, `${note} ${i + 1}/${state.pages.length}`);
    await nextFrame();
    await renderPage(state.pages[i]);
  }
  busy(false);
  draw();
}

/* ------------------------------------------------------------ rendering */
function draw() {
  els.cnt.textContent = state.pages.length;
  if (state.pages.length) els.hint.textContent = "눌러서 테두리 보정";
  else {
    els.hint.innerHTML = `<button class="linkbtn" id="btnSample">샘플로 시험해 보기</button>`;
    $("#btnSample").onclick = loadSample;
  }
  els.tray.innerHTML = "";
  state.pages.forEach((p, i) => {
    const li = document.createElement("li");
    li.className = "page" + (p.sample ? " sample" : "");
    const btn = document.createElement("button");
    btn.className = "thumbwrap";
    btn.title = "테두리 보정";
    btn.innerHTML =
      `<img src="${p.thumb}" alt="${i + 1}번째 페이지 미리보기">` +
      `<span class="num mono">${String(i + 1).padStart(2, "0")}</span>` +
      (p.sample ? `<span class="tag">샘플</span>` : "") +
      `<span class="dims mono">${p.outW}&times;${p.outH}</span>`;
    btn.onclick = () => openEditor(p);
    const acts = document.createElement("div");
    acts.className = "acts";
    acts.innerHTML =
      `<button data-a="up" ${i === 0 ? "disabled" : ""} aria-label="앞으로">&larr;</button>` +
      `<button data-a="edit" aria-label="보정">보정</button>` +
      `<button data-a="down" ${i === state.pages.length - 1 ? "disabled" : ""} aria-label="뒤로">&rarr;</button>` +
      `<button data-a="del" class="del" aria-label="삭제">삭제</button>`;
    acts.onclick = (e) => {
      const a = e.target.closest("button"); if (!a) return;
      const k = a.dataset.a;
      if (k === "del") { state.pages.splice(i, 1); draw(); say(""); }
      else if (k === "edit") openEditor(p);
      else {
        const j = k === "up" ? i - 1 : i + 1;
        if (j < 0 || j >= state.pages.length) return;
        state.pages[i] = state.pages[j]; state.pages[j] = p; draw();
      }
    };
    li.append(btn, acts);
    els.tray.appendChild(li);
  });
  const li = document.createElement("li");
  const add = document.createElement("button");
  add.className = "add";
  add.innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>` +
    `<span>${state.pages.length ? "문서 추가" : "첫 문서 촬영"}</span>`;
  add.onclick = () => $("#fileShoot").click();
  li.appendChild(add);
  els.tray.appendChild(li);
}

/* -------------------------------------------------------------- editor */
let ed = null, edResolve = null;

// confirm이 있으면 "촬영 직후 검출 결과 확인" 모드로 연다.
// 어느 쪽이든 편집기가 닫힐 때까지 기다리는 프라미스를 돌려준다.
async function openEditor(page, confirm) {
  busy(true, "사진 여는 중…");
  await nextFrame();
  const { img, url } = await loadImage(page.srcBlob);
  const src = toCanvas(img, MAX_SRC_PX);
  URL.revokeObjectURL(url);
  const maxW = Math.min(window.innerWidth - 40, 620);
  const maxH = window.innerHeight - 190;
  const scale = Math.min(1, maxW / src.width, maxH / src.height);
  const vw = Math.round(src.width * scale), vh = Math.round(src.height * scale);
  els.edCanvas.width = vw; els.edCanvas.height = vh;
  els.edCanvas.getContext("2d").drawImage(src, 0, 0, vw, vh);
  els.edSvg.setAttribute("viewBox", `0 0 ${vw} ${vh}`);
  els.hold.style.width = vw + "px";
  ed = {
    page, src, scale, vw, vh, confirm: confirm || null,
    quad: page.quad.map((p) => ({ x: p.x * scale, y: p.y * scale })),
    rot: page.rot || 0,
  };
  if (confirm) {
    els.edTitle.textContent = confirm.total > 1
      ? `테두리를 확인하세요 · ${confirm.index}/${confirm.total}`
      : "이렇게 잡았습니다. 맞나요?";
    els.edCancel.textContent = "이대로";
  } else {
    els.edTitle.textContent = "네 모서리를 문서 꼭짓점에 맞추세요";
    els.edCancel.textContent = "취소";
  }
  $("#edRot").textContent = ed.rot ? `회전 ${ed.rot}°` : "회전 90°";
  paintQuad();
  busy(false);
  els.editor.classList.add("open");
  return new Promise((resolve) => { edResolve = resolve; });
}
function paintQuad() {
  if (!ed) return;
  const pts = ed.quad.map((p) => `${p.x},${p.y}`).join(" ");
  let s = `<polygon class="quad-fill" points="${pts}"></polygon>`;
  ed.quad.forEach((p, i) => {
    s += `<circle class="handle" cx="${p.x}" cy="${p.y}" r="8"></circle>`;
    s += `<circle class="handle-hit" data-i="${i}" cx="${p.x}" cy="${p.y}" r="26"></circle>`;
  });
  els.edSvg.innerHTML = s;
}
let dragI = -1, dragOff = { x: 0, y: 0 };
function svgPoint(e) {
  const r = els.edSvg.getBoundingClientRect();
  return { x: (e.clientX - r.left) * ed.vw / r.width, y: (e.clientY - r.top) * ed.vh / r.height };
}
els.edSvg.addEventListener("pointerdown", (e) => {
  const t = e.target.closest("[data-i]"); if (!t || !ed) return;
  dragI = +t.dataset.i;
  const p = svgPoint(e);
  dragOff = { x: ed.quad[dragI].x - p.x, y: ed.quad[dragI].y - p.y };
  els.edSvg.setPointerCapture(e.pointerId);
  e.preventDefault();
});
els.edSvg.addEventListener("pointermove", (e) => {
  if (dragI < 0 || !ed) return;
  const p = svgPoint(e);
  ed.quad[dragI] = {
    x: Math.max(0, Math.min(ed.vw, p.x + dragOff.x)),
    y: Math.max(0, Math.min(ed.vh, p.y + dragOff.y)),
  };
  paintQuad();
  e.preventDefault();
});
const endDrag = () => { dragI = -1; };
els.edSvg.addEventListener("pointerup", endDrag);
els.edSvg.addEventListener("pointercancel", endDrag);

function hideEditor() {
  els.editor.classList.remove("open");
  if (ed) freeCanvas(ed.src);
  ed = null;
}
function finishEditor() {
  const r = edResolve; edResolve = null;
  if (r) r();
}
function closeEditor() { hideEditor(); finishEditor(); }
$("#edCancel").onclick = closeEditor;
$("#edAuto").onclick = () => {
  if (!ed) return;
  const q = detectQuad(ed.src);
  ed.quad = q.map((p) => ({ x: p.x * ed.scale, y: p.y * ed.scale }));
  paintQuad();
};
$("#edAll").onclick = () => {
  if (!ed) return;
  ed.quad = fullQuad(ed.vw, ed.vh, 0);
  paintQuad();
};
$("#edRot").onclick = (e) => {
  if (!ed) return;
  ed.rot = (ed.rot + 90) % 360;
  // 미리보기는 그대로 두고, 적용했을 때 얼마나 돌아가는지만 버튼에 표시한다
  e.currentTarget.textContent = ed.rot ? `회전 ${ed.rot}°` : "회전 90°";
};
const sameQuad = (a, b) =>
  a && b && a.every((p, i) => Math.abs(p.x - b[i].x) < 0.5 && Math.abs(p.y - b[i].y) < 0.5);

$("#edApply").onclick = async () => {
  if (!ed) return;
  const { page, scale, rot, confirm } = ed;
  const quad = orderQuad(ed.quad.map((p) => ({ x: p.x / scale, y: p.y / scale })));
  const changed = rot !== (page.rot || 0) || !sameQuad(quad, page.quad);
  page.quad = quad;
  page.rot = rot;
  hideEditor();
  if (changed) {
    busy(true, "보정 적용 중…");
    await nextFrame();
    await renderPage(page);
    busy(false);
    draw();
    if (!confirm) say("보정을 적용했습니다.");
  }
  finishEditor();
};

/* ---------------------------------------------------------- PDF writer */
const PAPER = { a4: [595.276, 841.89], letter: [612, 792] };
function buildPdf(items, paper) {
  const enc = new TextEncoder();
  const parts = []; let len = 0;
  const put = (u8) => { parts.push(u8); len += u8.length; };
  const putStr = (s) => put(enc.encode(s));
  const offsets = [];
  const objCount = 2 + items.length * 3;

  putStr("%PDF-1.4\n");
  put(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

  const kids = items.map((_, i) => `${3 + i * 3} 0 R`).join(" ");
  const startObj = (n) => { offsets[n] = len; putStr(`${n} 0 obj\n`); };
  const endObj = () => putStr("endobj\n");

  startObj(1); putStr("<< /Type /Catalog /Pages 2 0 R >>\n"); endObj();
  startObj(2); putStr(`<< /Type /Pages /Count ${items.length} /Kids [${kids}] >>\n`); endObj();

  items.forEach((it, i) => {
    const pageN = 3 + i * 3, imgN = pageN + 1, contN = pageN + 2;
    let pw, ph;
    if (paper === "fit") {
      pw = 595.276; ph = Math.round(pw * it.h / it.w * 1000) / 1000;
      if (it.w > it.h) { ph = 595.276; pw = Math.round(ph * it.w / it.h * 1000) / 1000; }
    } else {
      const [a, b] = PAPER[paper] || PAPER.a4;
      const land = it.w > it.h;
      pw = land ? b : a; ph = land ? a : b;
    }
    const k = Math.min(pw / it.w, ph / it.h);
    const dw = it.w * k, dh = it.h * k;
    const ox = (pw - dw) / 2, oy = (ph - dh) / 2;

    startObj(pageN);
    putStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(3)} ${ph.toFixed(3)}] ` +
      `/Resources << /XObject << /Im0 ${imgN} 0 R >> >> /Contents ${contN} 0 R >>\n`);
    endObj();

    startObj(imgN);
    putStr(`<< /Type /XObject /Subtype /Image /Width ${it.w} /Height ${it.h} ` +
      `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${it.bytes.length} >>\nstream\n`);
    put(it.bytes);
    putStr("\nendstream\n"); endObj();

    const content = `q\n${dw.toFixed(3)} 0 0 ${dh.toFixed(3)} ${ox.toFixed(3)} ${oy.toFixed(3)} cm\n/Im0 Do\nQ\n`;
    const cb = enc.encode(content);
    startObj(contN);
    putStr(`<< /Length ${cb.length} >>\nstream\n`); put(cb); putStr("endstream\n"); endObj();
  });

  const xref = len;
  putStr(`xref\n0 ${objCount + 1}\n0000000000 65535 f \n`);
  for (let n = 1; n <= objCount; n++) putStr(String(offsets[n]).padStart(10, "0") + " 00000 n \n");
  putStr(`trailer\n<< /Size ${objCount + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

  const outBuf = new Uint8Array(len);
  let o = 0;
  for (const p of parts) { outBuf.set(p, o); o += p.length; }
  return new Blob([outBuf], { type: "application/pdf" });
}

async function savePdf() {
  if (!state.pages.length) { say("먼저 문서를 촬영해 주세요.", true); return; }
  busy(true, "PDF 만드는 중…");
  await nextFrame();
  let blob;
  try {
    const items = [];
    for (const p of state.pages) {
      items.push({ w: p.outW, h: p.outH, bytes: new Uint8Array(await p.outBlob.arrayBuffer()) });
    }
    blob = buildPdf(items, state.paper);
  } catch (e) {
    busy(false); say("PDF를 만들지 못했습니다: " + e.message, true); return;
  }
  busy(false);

  const raw = (els.fname.value || "스캔문서").trim().replace(/[\\/:*?"<>|]/g, "");
  const filename = (raw || "스캔문서") + ".pdf";
  const kb = Math.round(blob.size / 1024);
  const size = kb > 1024 ? (kb / 1024).toFixed(1) + " MB" : kb + " KB";

  const done = `${filename} (${state.pages.length}장 · ${size})`;

  // 1) Claude 아티팩트로 게시했을 때: 런타임 downloads 기능
  if (downloads) {
    try {
      await downloads.save({ filename, data: blob });
      say(done + " 저장했습니다.");
    } catch (err) {
      const c = err && err.code;
      if (c === "declined") say("저장을 취소했습니다.");
      else if (c === "rate_limited") say("잠시 후 다시 눌러 주세요.", true);
      else say("저장하지 못했습니다. 다시 시도해 주세요.", true);
    }
    return;
  }

  // 2) 아이폰/안드로이드: 공유 시트 (파일에 저장, 메일로 보내기 등)
  try {
    const file = new File([blob], filename, { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      // files만 넘긴다. title이나 text를 함께 주면 iOS가 그 문자열을 별개의
      // 공유 항목으로 취급해서, "파일에 저장" 때 PDF 옆에 그 문자열이 담긴
      // 텍스트 파일이 하나 더 저장된다. 파일 이름은 File 객체가 이미 갖고 있다.
      await navigator.share({ files: [file] });
      say(done + " 공유했습니다.");
      return;
    }
  } catch (err) {
    if (err && err.name === "AbortError") { say("저장을 취소했습니다."); return; }
    // 공유가 막혀 있으면 아래 일반 다운로드로 넘어간다
  }

  // 3) 데스크톱 브라우저: 일반 다운로드
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    say(done + " 내려받았습니다.");
  } catch (err) {
    say("저장하지 못했습니다: " + err.message, true);
  }
}

/* ------------------------------------------------------- sample page */
function drawSample() {
  const W = 880, H = 1180;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#4a5854"); g.addColorStop(.55, "#33413d"); g.addColorStop(1, "#232e2b");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 5200; i++) {
    x.fillStyle = `rgba(255,255,255,${Math.random() * .035})`;
    x.fillRect(Math.random() * W, Math.random() * H, 2, 2);
  }
  const PW = 620, PH = 850;
  x.save();
  x.translate(W / 2 + 12, H / 2 - 6);
  x.rotate(-0.062);
  x.transform(1, 0.052, -0.036, 1, 0, 0);
  x.translate(-PW / 2, -PH / 2);
  x.shadowColor = "rgba(0,0,0,.55)"; x.shadowBlur = 46; x.shadowOffsetY = 20;
  x.fillStyle = "#f8f6f1"; x.fillRect(0, 0, PW, PH);
  x.shadowColor = "transparent";
  x.beginPath(); x.rect(0, 0, PW, PH); x.clip();

  const F = '"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif';
  x.fillStyle = "#1a2422";
  x.font = `600 34px ${F}`;
  x.fillText("2026년 3분기 운영 회의록", 52, 96);
  x.fillStyle = "#7a8480";
  x.font = `400 15px ${F}`;
  x.fillText("2026-09-04 (금)  14:00–15:20  ·  본관 3층 회의실", 52, 126);
  x.fillStyle = "#c8ccc6"; x.fillRect(52, 146, PW - 104, 1.6);

  const body = [
    "1. 지난 분기 미결 안건 검토",
    "   전 분기 이월된 세 건 중 두 건은 완료 처리하고, 남은 한 건은",
    "   담당 부서를 재지정한 뒤 10월 첫째 주까지 회신을 받기로 한다.",
    "",
    "2. 문서 전산화 진행 상황",
    "   종이 원본 보관 기간이 지난 서류부터 순차 스캔하며, 스캔본은",
    "   부서별 폴더에 연·월 단위로 정리한다. 원본 폐기는 검수 후 진행.",
    "",
    "3. 다음 회의",
    "   10월 2일 목요일 14시. 각 부서는 사흘 전까지 안건을 등록한다.",
  ];
  x.font = `400 17px ${F}`;
  body.forEach((line, i) => {
    x.fillStyle = line.startsWith("   ") ? "#3e4b47" : "#16211f";
    x.font = `${line.startsWith("   ") ? 400 : 500} 17px ${F}`;
    x.fillText(line, 52, 194 + i * 31);
  });

  const ty = 194 + body.length * 31 + 26;
  x.strokeStyle = "#ccd2ce"; x.lineWidth = 1;
  const cols = [52, 250, 400, PW - 52];
  const rows = [ty, ty + 34, ty + 68, ty + 102];
  rows.forEach((ry) => { x.beginPath(); x.moveTo(cols[0], ry); x.lineTo(cols[3], ry); x.stroke(); });
  cols.forEach((cxp) => { x.beginPath(); x.moveTo(cxp, rows[0]); x.lineTo(cxp, rows[3]); x.stroke(); });
  const cells = [["항목", "담당", "기한"], ["보관 서류 스캔", "총무팀", "09-30"], ["폴더 규칙 배포", "정보팀", "10-07"]];
  x.font = `400 15px ${F}`;
  cells.forEach((row, r) => {
    row.forEach((t, ci) => {
      x.fillStyle = r === 0 ? "#6b7571" : "#222d2a";
      x.font = `${r === 0 ? 500 : 400} 15px ${F}`;
      x.fillText(t, cols[ci] + 12, rows[r] + 22);
    });
  });

  // uneven lighting so the "선명" mode has something to remove
  const lg = x.createLinearGradient(0, 0, PW, PH);
  lg.addColorStop(0, "rgba(0,0,0,0)");
  lg.addColorStop(.62, "rgba(20,26,24,.10)");
  lg.addColorStop(1, "rgba(20,26,24,.30)");
  x.fillStyle = lg; x.fillRect(0, 0, PW, PH);
  x.restore();
  return c;
}

/* ---------------------------------------------------------------- wire */
$("#btnShoot").onclick = () => $("#fileShoot").click();
$("#btnPick").onclick = () => $("#filePick").click();
$("#fileShoot").onchange = (e) => { addFiles(e.target.files, false); e.target.value = ""; };
$("#filePick").onchange = (e) => { addFiles(e.target.files, false); e.target.value = ""; };
$("#btnSave").onclick = savePdf;

$("#segMode").onclick = async (e) => {
  const b = e.target.closest("button[data-mode]"); if (!b) return;
  if (state.mode === b.dataset.mode) return;
  state.mode = b.dataset.mode;
  [...e.currentTarget.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
  await reprocessAll("색 처리 다시 적용 중…");
};
$("#segPaper").onclick = (e) => {
  const b = e.target.closest("button[data-paper]"); if (!b) return;
  state.paper = b.dataset.paper;
  [...e.currentTarget.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && els.editor.classList.contains("open")) closeEditor();
});

// 합성 문서 사진 한 장을 만들어 담는다. 카메라가 없는 데스크톱에서
// 검출·보정 파이프라인을 시험해 볼 때 쓴다.
async function loadSample() {
  const c = drawSample();
  const blob = await canvasToBlob(c, "image/jpeg", 0.9);
  freeCanvas(c);
  await addFiles([new File([blob], "sample.jpg", { type: "image/jpeg" })], true);
  say("샘플 한 장을 담았습니다. 색 처리와 테두리 보정을 시험해 보세요.");
}

(async function init() {
  draw();
  try {
    if (window.claude && typeof window.claude.use === "function") {
      downloads = await window.claude.use("downloads");
    }
  } catch (_) { downloads = null; }
  pdfSupport = downloads ? "artifact" : "standalone";
})();
</script>
